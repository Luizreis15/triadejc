name: ci

on:
  pull_request:
  push:
    branches: [main, sec/p1]

jobs:
  spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=critical

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Track A functions
        run: |
          deno check \
            supabase/functions/kiwify-webhook/index.ts \
            supabase/functions/send-welcome-email/index.ts \
            supabase/functions/send-abandoned-cart/index.ts \
            supabase/functions/_shared/crypto.ts \
            supabase/functions/_shared/outbox.ts
      - name: Test webhook and outbox
        run: deno test --allow-env --allow-net --allow-read supabase/functions/
